<noscript><section class="nojs" style="max-width:900px;margin:24px auto;padding:0 16px;line-height:1.9"><h1>Abdelmalek Studio</h1><p>Graphic Designer &amp; AI Creator</p><p>الموقع محتاج JavaScript عشان يعرض البحث والفلاتر. دي قائمة بكل المصادر:</p><h2>شغلي</h2><p>معرض أعمالي وحساباتي ومشاريعي في مكان واحد.</p><ul><li><a href="https://www.behance.net/mahmooud_3li" rel="noopener noreferrer">Behance: البورتفوليو الكامل</a> — كل مشاريعي بالتفصيل: هويات بصرية وتصميمات سوشيال وإعلانات.</li><li><a href="https://www.facebook.com/abdelmalek.studio/" rel="noopener noreferrer">Facebook</a> — تابع شغلي الجديد أول بأول على صفحتي.</li><li><a href="https://www.pinterest.com/abdelmalekstudio/" rel="noopener noreferrer">Pinterest (صفحتي)</a> — لوحات إلهام ومراجع بجمعها لمشاريعي.</li><li><a href="https://www.instagram.com/abdelmalek.studio/" rel="noopener noreferrer">Instagram</a> — أحدث تصميماتي وأفكاري على إنستجرام.</li><li><a href="https://www.youtube.com/@abdelmalek.studio" rel="noopener noreferrer">YouTube</a> — قناتي على يوتيوب.</li><li><a href="https://www.linkedin.com/in/abdelmalekstudio/" rel="noopener noreferrer">LinkedIn</a> — حسابي المهني على لينكدإن.</li><li><a href="https://www.tiktok.com/@abdelmalek.studio" rel="noopener noreferrer">TikTok</a> — مقاطعي القصيرة على تيك توك.</li></ul><h2>فيديوهات تعليمية</h2><p>شروحات على قناتي — اضغط على الفيديو لمشاهدته.</p><ul><li><a href="https://youtu.be/n6pG39wZpOw" rel="noopener noreferrer">فيديو من القناة</a></li><li><a href="https://youtu.be/kMJlBDzpzxc" rel="noopener noreferrer">فيديو من القناة</a></li><li><a href="https://youtu.be/Wumkmr7vGno" rel="noopener noreferrer">فيديو من القناة</a></li></ul><h2>أدواتي اليومية</h2><p>المواقع اللي بفتحها كل يوم تقريبًا في شغلي — الأساسيات اللي مبستغناش عنها.</p><ul><li><a href="https://chatgpt.com/" rel="noopener noreferrer">ChatGPT</a> — مساعدي في الأفكار والكتابة والبرومبتات وتلخيص أي حاجة، وبولّد بيه صور كمان.</li><li><a href="https://claude.ai/" rel="noopener noreferrer">Claude</a> — للكتابة الطويلة وتحليل الملفات والشغل المركّز، وبيفهم العربي كويس.</li><li><a href="https://gemini.google.com/" rel="noopener noreferrer">Google Gemini</a> — مساعد جوجل: بحث وتحليل وتوليد وتعديل صور (Nano Banana) في نفس المحادثة.</li><li><a href="https://labs.google/flow/about" rel="noopener noreferrer">Google Flow</a> — استوديو جوجل لتوليد الفيديو والصور بالذكاء الاصطناعي (Veo). فيه رصيد يومي مجاني محدود، والباقات بتزوّد الرصيد.</li></ul><h2>AI صور وفيديو</h2><p>أدوات بتولّد الصور والفيديو من مكان واحد.</p><ul><li><a href="https://magnific.com/" rel="noopener noreferrer">Magnific</a> — (كان اسمه Freepik AI) محتوى مجاني ومدفوع – أدوات AI مدفوعة. الصور والـ Stock Assets فيها محتوى مجاني ومحتوى مدفوع، وأدوات الذكاء الاصطناعي (توليد صور وفيديو، رفع دقة وتحسين صور) مدفوعة بالكامل.</li><li><a href="https://www.krea.ai/" rel="noopener noreferrer">Krea</a> — توليد صور وفيديو ورفع جودة، وتوليد لحظي وأنت بترسم. فيه رصيد يومي مجاني من غير كارت.</li><li><a href="https://leonardo.ai/" rel="noopener noreferrer">Leonardo AI</a> — صور وتحريك صور لفيديو، وتحكم كويس في الستايل. بيدي توكنز يومية مجانية.</li><li><a href="https://dreamina.capcut.com/" rel="noopener noreferrer">Dreamina (CapCut)</a> — من بايت دانس: صور وفيديو (موديلات Seedance) برصيد يومي مجاني، ومتكامل مع CapCut.</li><li><a href="https://firefly.adobe.com/" rel="noopener noreferrer">Adobe Firefly</a> — صور وفيديو وتعبئة توليدية، ومتصمم للاستخدام التجاري. فيه كريدت شهري مجاني محدود والباقي باشتراك.</li><li><a href="https://higgsfield.ai/" rel="noopener noreferrer">Higgsfield</a> — منصة بتجمع أحدث موديلات الصور والفيديو في مكان واحد، وقوية في حركات الكاميرا. فيه تجربة مجانية بسيطة، والاستخدام الحقيقي باشتراك.</li><li><a href="https://app.weavy.ai/" rel="noopener noreferrer">Weavy (Figma Weave)</a> — كانفاس بالعُقد (Nodes) بتربط موديلات الصور والفيديو وأدوات التعديل في مكان واحد، وتبني بيه Workflow تعيد استخدامه. فيه رصيد شهري مجاني.</li><li><a href="https://nordy.ai/" rel="noopener noreferrer">Nordy</a> — بتشغّل ComfyUI على السحابة من أي جهاز من غير كارت شاشة ولا تنصيب، وفيه تطبيقات جاهزة (EasyApps) لتوليد الصور والفيديو والصوت. مجاني مع خيارات مدفوعة بالرصيد.</li><li><a href="https://www.pippit.ai/home" rel="noopener noreferrer">Pippit (CapCut)</a> — من فريق CapCut: بيحوّل لينك منتج أو نص لفيديو وصور إعلانية، مع أفاتار ومحرر فيديو. مناسب لإعلانات السوشيال والمتاجر.</li><li><a href="https://www.roboneo.com/home" rel="noopener noreferrer">RoboNeo</a> — وكيل ذكاء اصطناعي من Meitu: بتوصفله اللي عايزه بالكلام، وفريق الوكلاء بينفّذ تصميم وتعديل صور وفيديو. التطبيق مجاني وفيه اشتراكات وكريدت.</li><li><a href="https://www.atlascloud.ai/ar" rel="noopener noreferrer">Atlas Cloud</a> — منصة API بتجمع أكتر من 300 موديل (نصوص وصور وفيديو) بمفتاح واحد وحساب واحد، والدفع حسب الاستخدام. للمطوّرين ومن بيبني أدوات.</li></ul><h2>AI صور</h2><p>أقوى أدوات توليد وتحسين الصور بالذكاء الاصطناعي، المجاني منها والمدفوع.</p><ul><li><a href="https://designer.microsoft.com/" rel="noopener noreferrer">Microsoft Designer</a> — توليد صور وتصميمات ببساطة بحساب مايكروسوفت المجاني. الترخيص للاستخدام الشخصي.</li><li><a href="https://huggingface.co/spaces" rel="noopener noreferrer">Hugging Face Spaces</a> — تجارب موديلات مفتوحة المصدر مجانًا من المتصفح. الجودة والسرعة بتتفاوت ومحتاج صبر في الزحمة.</li><li><a href="https://upscayl.org/" rel="noopener noreferrer">Upscayl</a> — برنامج مفتوح المصدر على جهازك لرفع دقة الصور، من غير حدود ولا اشتراك.</li><li><a href="https://ideogram.ai/" rel="noopener noreferrer">Ideogram</a> — الأفضل في كتابة النصوص والتايبوجرافي جوه الصورة، ومناسب للبوسترات واللوجو. فيه رصيد مجاني، والصور بتبقى عامة في المجاني.</li><li><a href="https://gemini.google.com/" rel="noopener noreferrer">Google Gemini</a> — توليد وتعديل صور بالمحادثة (Nano Banana). مجاني بحدود استخدام يومية.</li><li><a href="https://chatgpt.com/" rel="noopener noreferrer">ChatGPT</a> — توليد وتعديل صور بالمحادثة، وبيفهم الوصف الطويل كويس. المجاني له حد يومي.</li><li><a href="https://www.recraft.ai/" rel="noopener noreferrer">Recraft</a> — مناسب للمصممين: بيطلّع فيكتور SVG وأيقونات وستايلات تصميم نظيفة. فيه رصيد مجاني.</li><li><a href="https://www.canva.com/" rel="noopener noreferrer">Canva Magic Media</a> — توليد صور جوه كانفا مباشرة وتكملها في تصميمك. الحدود المجانية قليلة.</li><li><a href="https://magichour.ai/" rel="noopener noreferrer">Magic Hour</a> — صور يومية مجانية من غير حساب. الاستخدام التجاري محتاج باقة مدفوعة.</li><li><a href="https://www.midjourney.com/" rel="noopener noreferrer">Midjourney</a> — من أقوى الموديلات في الجمالية والستايل الفني. اشتراك فقط ومفيش نسخة مجانية.</li><li><a href="https://bfl.ai/" rel="noopener noreferrer">FLUX (Black Forest Labs)</a> — موديلات FLUX، وبعضها مفتوح المصدر وتقدر تشغله على جهازك، ومتاح بالدفع حسب الاستخدام.</li><li><a href="https://www.topazlabs.com/" rel="noopener noreferrer">Topaz Labs</a> — أدوات احترافية لرفع جودة الصور والفيديو وتقليل الضوضاء.</li></ul><h2>AI فيديو</h2><p>حوّل فكرتك أو صورتك لفيديو بأدوات الذكاء الاصطناعي.</p><ul><li><a href="https://klingai.com/" rel="noopener noreferrer">Kling AI</a> — من أقوى مولدات الفيديو في الحركة والواقعية. المجاني بعلامة مائية وبجودة أقل، والباقات من حوالي 10 دولار.</li><li><a href="https://lumalabs.ai/dream-machine" rel="noopener noreferrer">Luma Dream Machine</a> — فيديو سينمائي من نص أو صورة. المجاني محدود وبعلامة مائية.</li><li><a href="https://hailuoai.video/" rel="noopener noreferrer">Hailuo AI (MiniMax)</a> — حركة سلسة وتحريك صور كويس. المجاني بعلامة مائية وبعدد لقطات قليل.</li><li><a href="https://pixverse.ai/" rel="noopener noreferrer">PixVerse</a> — رصيد يومي مجاني، وقوالب وتأثيرات جاهزة لفيديوهات السوشيال.</li><li><a href="https://runwayml.com/" rel="noopener noreferrer">Runway</a> — أداة احترافية لتوليد الفيديو وتعديله. بيدي رصيد تجريبي مرة واحدة بس وبعدها باشتراك.</li><li><a href="https://pika.art/" rel="noopener noreferrer">Pika</a> — تأثيرات إبداعية وتحريك صور، بالكريدت أو بالاشتراك.</li><li><a href="https://pollo.ai/home" rel="noopener noreferrer">Pollo AI</a> — مولّد فيديو بيجمع موديلات كتير (Kling وRunway وHailuo وغيرهم) في مكان واحد، مع قوالب وتأثيرات جاهزة. المجاني برصيد قليل وبعلامة مائية.</li></ul><h2>Prompts</h2><p>Prompts جاهزة بتفتحها وتنسخها بضغطة واحدة وتجرّبها على أدوات الذكاء الاصطناعي.</p><ul><li>تبديل الشخص واللبس (3 مراجع) — بتدي 3 صور: الأولى للشخص، التانية للبس، التالتة للوضعية والكادر. بيطلع نفس الصورة الأخيرة بالشخص واللبس الجداد على خلفية استوديو أبيض.</li><li>تايبوجرافي عربي مخصص — بيحوّل أي كلمة عربي للترتيب حروف مخصص ومدوّر وسميك، أبيض على خلفية سودا. غيّر الكلمة جوه arabic_text.</li><li>رفع جودة الصورة للطباعة — بيحسّن دقة الصورة ويقلل البكسلة والضوضاء ويجهّزها للطباعة من غير ما يغيّر في محتواها أو ألوانها.</li><li>كركتر شيت — شيت من 4 لقطات لنفس الشخص (أمامي، جانبي، 3/4، جسم كامل) بتطابق عالي للملامح. اكتب وصف الجسم واللبس مكان الأقواس [ ].</li><li>صورة إعلانية احترافية لأي منتج — ترفع صورة المنتج وبيحطه في مشهد إعلاني واقعي مناسب لنوعه (أكل، مشروب، تجميل، إلكترونيات…) مع الحفاظ على شكل العبوة والنص العربي والإنجليزي واللوجو 100%. وكل مرة بيطلع لك فكرة إعلان مختلفة.</li><li>تحويل اللوجو لأبيض وأسود جاهز للـ Vector — بيحوّل اللوجو لنسخة أسود على أبيض مسطحة بحواف حادة، مناسبة لعمل Image Trace في Illustrator من غير ما يغيّر أي حاجة في التصميم. ملحوظة: النص مكتوب فيه (gold) فغيّرها للون اللوجو بتاعك.</li><li>هوية بصرية كاملة من اللوجو (Brand Guidelines) — من لوجو واحد بيطلع لك عرض هوية بصرية كامل: ألوان وخطوط وعناصر جرافيك وقرطاسية وعبوات وموكاب ولافتات وموقع وسوشيال، في شكل Brand Guidelines فاخر، واللوجو بيفضل زي ما هو.</li><li>تحريك اللوجو بدخلة 3D سينمائية — قالب جاهز تكتب فيه اسم اللوجو ووصف دقيق لعناصره بين الأقواس [ ]، وبيطلع فيديو حوالي 10 ثواني: اللوجو بيقوم من وضع مائل لوضع واقف بكاميرا سينمائية وصوت هادي، على خلفية استوديو أبيض.</li><li>ترميم وتكبير صور الأشخاص الضعيفة (حتى 10K) — بيرمّم الصور المبكسلة أو الضبابية أو المضغوطة ويكبّرها، ويرجّع تفاصيل الوش والعيون والشعر والجلد والأسنان من غير ما يغيّر الملامح أو الكادر أو الخلفية.</li><li>كاريكاتير 3D مبالغ فيه من صورتك — ترفع صورة شخص وبيطلع منه كاريكاتير 3 ://www.iloveimg.com/" rel="noopener noreferrer">iLoveIMG</a> — أدوات صور سريعة: قص وتحويل وضغط وتغيير مقاس</li><li><a href="https://manus.im/" rel="noopener noreferrer">Manus</a> — وكيل ذكاء اصطناعي بينفّذ مهام كاملة لوحده: بحث وتحليل وتقارير وسلايدز وبناء مواقع. فيه رصيد يومي مجاني، والمهام الكبيرة بتستهلك رصيد.</li><li><a href="https://flowith.io/" rel="noopener noreferrer">Flowith</a> — مساحة عمل بالذكاء الاصطناعي على كانفاس مفتوح بدل الشات الطويل، وفيها وكيل (Agent Neo) وبتشتغل بأكتر من موديل. فيه خطة مجانية.</li><li><a href="https://duck.ai/" rel="noopener noreferrer">Duck.ai</a> — شات ذكاء اصطناعي من DuckDuckGo بخصوصية عالية، من غير حساب، وبتختار من أكتر من موديل. مجاني بحد يومي.</li></ul><h2>ملفات</h2><p>ملفات وموارد جاهزة للتحميل.</p><ul><li><a href="https://drive.google.com/drive/folders/1PRQ2BOolQ_-EJHN_OtYHDA3jF5cO01G6?usp=sharing" rel="noopener noreferrer">ملفاتي على درايف</a> — ملفات ومصادر أشاركها معاكم، حمّلوا اللي يفيدكم</li><li><a href="https://drive.google.com/drive/folders/1GaOl2Ha0AII8QSIhiuOCyA7380DVfQVl?usp=sharing" rel="noopener noreferrer">ملفات إضافية على درايف</a> — مجلد تاني فيه ملفات ومصادر أشاركها معاكم، حمّلوا اللي يفيدكم</li></ul></section></noscript>
