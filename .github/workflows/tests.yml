# نفس اختبارات النشر بالظبط، على أي Pull Request أو يدويًا (من غير نشر). محتاجة مجلد admin/ — وهو مرفوع في المستودع (راجع .gitignore).
name: Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tools/check-syntax.js
      - run: npm test
        env:
          CI: "true"
